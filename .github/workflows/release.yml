name: Release

# Runs on every merge to the default branch, but only actually releases when
# the version in package.json is one npm hasn't seen yet. Bumping the version
# in the merged commit is what triggers a release; every other merge is a no-op.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Only whether the secret exists, never its value: the `secrets` context is
    # not available in a step's `if`, and putting the token itself in the job
    # env would hand it to `npm ci` and every build script it runs.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    permissions:
      # Creating the git tag and the GitHub release.
      contents: write
      # npm trusted publishing: the OIDC token minted from this permission is
      # what authenticates the publish, and what npm attests provenance with.
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No registry-url on purpose: it makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, which trusted publishing does not set,
      # and an empty auth token makes the publish fail instead of falling back
      # to OIDC. The default registry is npmjs.org anyway.
      - name: Use Node.js 22.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x

      # Trusted publishing needs npm 11.5.1+; Node 22 still bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is already published
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not published yet, releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint the project
        if: steps.version.outputs.publish == 'true'
        run: npm run lint

      - name: Build the project
        if: steps.version.outputs.publish == 'true'
        run: npm run build
        env:
          CI: true

      # Bootstrap path only. Trusted publishing is configured on a package's
      # own settings page, so it cannot create a package that does not exist
      # yet: the first publish needs a token. Once the package exists and a
      # trusted publisher is configured, delete the NPM_TOKEN secret and this
      # step switches itself off.
      - name: Authenticate with NPM_TOKEN
        if: steps.version.outputs.publish == 'true' && env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"

      # With no token in the npm config this authenticates through npm trusted
      # publishing (OIDC), where the id-token permission above is the whole
      # credential. Provenance is meant to be implicit there, but npm has
      # shipped releases where it is not, so the flag stays either way.
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance

      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
